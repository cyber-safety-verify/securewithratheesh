<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureWithRatheesh QR</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050a12;color:#fff;font-family:Arial}.box{width:min(92%,520px);padding:28px;text-align:center;border-radius:25px;background:#0d1a2b;border:1px solid #20334b}input{width:100%;padding:12px;box-sizing:border-box;border-radius:10px;border:1px solid #30445c;background:#07111f;color:#fff;margin:12px 0}button{padding:12px 18px;border:0;border-radius:10px;background:#00e5ff;font-weight:800;cursor:pointer}#qr{margin:22px auto;background:#fff;padding:12px;border-radius:15px;max-width:90%}a{color:#00e5ff}.note{color:#91a3b8;font-size:13px}</style></head><body><div class="box"><h1>SecureWithRatheesh ⚡</h1><p class="note">Enter your final public HTTPS GitHub Pages URL.</p><input id="url" value="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/"><button onclick="makeQR()">Generate QR</button><div id="qr"></div><a id="download" style="display:none" download="securewithratheesh-qr.png">Download QR PNG</a></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>function makeQR(){const u=document.getElementById("url").value.trim();if(!/^https:\/\//i.test(u)){alert("Use a public HTTPS URL.");return}const q=document.getElementById("qr");q.innerHTML="";new QRCode(q,{text:u,width:420,height:420,colorDark:"#08111f",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});setTimeout(()=>{const c=q.querySelector("canvas"),i=q.querySelector("img"),d=document.getElementById("download");d.href=c?c.toDataURL("image/png"):i.src;d.style.display="inline-block"},300)}makeQR()</script></body></html>
